name: CI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: bash scripts/lint-workflows.sh

  check:
    needs: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.2", "24.15.0"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: mkdir -p /tmp/opencode
      - run: npm run typecheck && npm test && npm run test:helpers
      - run: npm run check:package
      - run: node --test test/release-artifact-smoke.test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/reviewer-npm" npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - run: echo "$RUNNER_TEMP/reviewer-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: node --test test/npm-cli-smoke.test.mjs
      - run: sudo apt-get update && sudo apt-get install --yes tmux
      - run: npm run test:runtime-cleanup

  runtime:
    needs: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install --yes tmux git python3
      - run: echo "OPENCODE_BIN=$RUNNER_TEMP/reviewer-host/node_modules/@opencode/cli-linux-x64/bin/opencode" >> "$GITHUB_ENV"
      - run: node scripts/ci-host.mjs resolve
      - run: npm install --prefix "$RUNNER_TEMP/reviewer-host" --ignore-scripts --no-audit --no-fund "@opencode/cli-linux-x64@$OPENCODE_HOST_VERSION"
      - run: node scripts/ci-host.mjs verify "$RUNNER_TEMP/reviewer-host"
      - run: npm run build
      - run: node scripts/test-runtime.mjs --profile ci
      - name: Report runtime durations
        if: always()
        run: node scripts/runtime-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: latest-v2-runtime
          path: .runtime/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
