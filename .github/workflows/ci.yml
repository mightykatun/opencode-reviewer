name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.2", "24.15.0"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: mkdir -p /tmp/opencode
      - run: npm run check
      - run: npm run check:package
      - run: node --test test/release-artifact-smoke.test.mjs
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: node --test test/npm-cli-smoke.test.mjs
      - run: sudo apt-get update && sudo apt-get install --yes tmux
      - run: npm run test:runtime-cleanup

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: "2.0.26"
            sha256: "d9123b9bcdb0a31f7ab9fe9812b58a9dc1768ad6d97e7b276dff1181813218c9"
          - host: "2.0.27"
            sha256: "e26aa101cfdc40f0e680baa609ff18f131bbc6b91c60fdc11b2b2e2cba7281a4"
    env:
      OPENCODE_BIN: ${{ runner.temp }}/reviewer-host/node_modules/@opencode/cli-linux-x64/bin/opencode
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install --yes tmux git python3
      - run: npm install --prefix "$RUNNER_TEMP/reviewer-host" --ignore-scripts --no-audit --no-fund "@opencode/cli-linux-x64@${{ matrix.host }}"
      - run: echo "${{ matrix.sha256 }}  $OPENCODE_BIN" | sha256sum --check
      - run: npm run build
      - run: node scripts/test-runtime.mjs --profile ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pinned-host-runtime-${{ matrix.host }}
          path: .runtime/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
