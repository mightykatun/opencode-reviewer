name: Extended host checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/lint-workflows.sh

  check:
    needs: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: mkdir -p /tmp/opencode
      - run: npm run typecheck && npm test && npm run test:helpers
      - run: npm run check:package
      - run: node --test test/release-artifact-smoke.test.mjs
      - run: npm install --global --prefix "$RUNNER_TEMP/reviewer-npm" npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - run: echo "$RUNNER_TEMP/reviewer-npm/bin" >> "$GITHUB_PATH"
      - run: echo "NPM_CONFIG_PREFIX=$RUNNER_TEMP/reviewer-npm" >> "$GITHUB_ENV"
      - run: node --test test/npm-cli-smoke.test.mjs
      - run: sudo apt-get update && sudo apt-get install --yes tmux
      - run: npm run test:runtime-cleanup

  runtime:
    needs: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install --yes tmux git python3
      - run: echo "OPENCODE_BIN=$RUNNER_TEMP/reviewer-host/node_modules/@opencode/cli-linux-x64/bin/opencode" >> "$GITHUB_ENV"
      - run: node scripts/ci-host.mjs resolve
      - run: npm install --prefix "$RUNNER_TEMP/reviewer-host" --ignore-scripts --no-audit --no-fund "@opencode/cli-linux-x64@$OPENCODE_HOST_VERSION"
      - run: node scripts/ci-host.mjs verify "$RUNNER_TEMP/reviewer-host"
      - run: npm run build
      - run: node scripts/test-runtime.mjs --profile v2-acceptance
      - name: Report runtime durations
        if: always()
        run: node scripts/runtime-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: latest-v2-runtime
          path: .runtime/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
