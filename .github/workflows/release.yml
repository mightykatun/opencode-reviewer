name: Verify and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-opencode-reviewer
  cancel-in-progress: false
  queue: max

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
  RELEASE_RUN_ID: ${{ github.run_id }}
  RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RELEASE_INPUT_TAG: ${{ inputs.tag || '' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      validation_attempt: ${{ steps.version.outputs.validation_attempt }}
      integrity: ${{ steps.artifact.outputs.integrity }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out active validation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-policy
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the verified publication npm version for CLI regressions
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Check release version and tag commit
        id: version
        env:
          TRIGGER_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            test "$TRIGGER_REF" = "refs/heads/$DEFAULT_BRANCH"
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          node release-policy/scripts/release-version.mjs

      - run: npm ci --ignore-scripts
      - run: mkdir -p /tmp/opencode
      - run: bash release-policy/scripts/lint-workflows.sh
      - run: npm run typecheck && npm test
      - run: node release-policy/scripts/test-helpers.mjs
      - run: npm run check:package
      - run: node --test release-policy/test/release-artifact-smoke.test.mjs
      - run: node --test release-policy/test/npm-cli-smoke.test.mjs

      - name: Pack and validate release artifact
        id: artifact
        env:
          RELEASE_VERIFIED_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_VALIDATION_ATTEMPT: ${{ steps.version.outputs.validation_attempt }}
        run: node release-policy/scripts/release-artifact.mjs prepare "$RUNNER_TEMP/release-package"

      - name: Upload immutable release artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    # Allow 60 minutes for npm processing plus setup and GitHub release upload.
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERIFIED_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_VALIDATION_ATTEMPT: ${{ needs.validate.outputs.validation_attempt }}
      RELEASE_INTEGRITY: ${{ needs.validate.outputs.integrity }}
    steps:
      - name: Check out immutable publication policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-policy
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release-version.mjs
            /scripts/release-artifact.mjs
            /scripts/release-provenance.mjs
            /scripts/publish-release.mjs
            /scripts/npm-publication.mjs
            /scripts/github-release.mjs
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Create private job-local npm cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$(mktemp -d "$RUNNER_TEMP/npm-release-cache.XXXXXXXX")"
          chmod 700 "$cache"
          printf 'NPM_CONFIG_CACHE=%s\n' "$cache" >> "$GITHUB_ENV"
          mkdir -m 700 "$cache/xdg"
          printf 'XDG_DATA_HOME=%s\n' "$cache/xdg" >> "$GITHUB_ENV"

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Download validated archive by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-package

      - name: Verify artifact identity and actual archive contents
        run: node release-policy/scripts/release-artifact.mjs verify "$RUNNER_TEMP/release-package"

      - name: Publish package and verify npm availability
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node release-policy/scripts/publish-release.mjs "$RUNNER_TEMP/release-package"

      - name: Create GitHub release and attach the verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release-policy/scripts/github-release.mjs "$RUNNER_TEMP/release-package"
