name: Release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-opencode-reviewer
  cancel-in-progress: false
  queue: max

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
  RELEASE_RUN_ID: ${{ github.run_id }}
  RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RELEASE_INPUT_TAG: ${{ inputs.tag || '' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      validation_attempt: ${{ steps.version.outputs.validation_attempt }}
      integrity: ${{ steps.artifact.outputs.integrity }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out active validation policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-policy
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release-version.mjs
            /scripts/test-helpers.mjs
            /scripts/helper-tests.json
            /scripts/release-artifact.mjs
            /scripts/release-provenance.mjs
            /scripts/bundled-sounds.mjs
            /scripts/publish-release.mjs
            /scripts/npm-publication.mjs
            /scripts/github-release.mjs
            /scripts/smoke-runtime.mjs
            /scripts/smoke-reviewer.mjs
            /scripts/smoke-notification-recorder.mjs
            /scripts/smoke-desktop-playback.mjs
            /scripts/smoke-stages.mjs
            /scripts/smoke-permissions.mjs
            /scripts/smoke.mjs
            /scripts/runtime-inventory.mjs
            /scripts/runtime-runner.mjs
            /scripts/test-runtime.mjs
            /scripts/smoke-scenarios.mjs
            /scripts/smoke-observations.mjs
            /scripts/smoke-ui.mjs
            /scripts/smoke-approval-geometry.mjs
            /scripts/smoke-review-admission.mjs
            /scripts/smoke-mouse-proof.mjs
            /scripts/smoke-v2-mouse-proof.mjs
            /scripts/smoke-v2-contracts.mjs
            /scripts/smoke-v2-catalog.mjs
            /scripts/smoke-v2-direct-tools.mjs
            /scripts/smoke-v2-profile-mapping.mjs
            /scripts/smoke-v2-effective-evidence.mjs
            /scripts/smoke-v2-root-presentation.mjs
            /scripts/smoke-v2-native-queue.mjs
            /scripts/smoke-v2-delegation.mjs
            /scripts/smoke-v2-companion-package.mjs
            /scripts/smoke-v2-lifecycle.mjs
            /scripts/smoke-v2-invocation.mjs
            /scripts/smoke-v2-review.mjs
            /scripts/smoke-v2-sidebar-state.mjs
            /scripts/smoke-style-retirement.mjs
            /scripts/smoke-approval-recovery.mjs
            /scripts/smoke-evidence.mjs
            /scripts/smoke-fast-mode.mjs
            /scripts/smoke-history.mjs
            /scripts/smoke-history-auto.mjs
            /scripts/smoke-history-render.mjs
            /scripts/smoke-history-phase0.mjs
            /scripts/smoke-history-storage.mjs
            /scripts/smoke-history-lifecycle.mjs
            /scripts/smoke-history-maintenance.mjs
            /scripts/smoke-statistics.mjs
            /scripts/smoke-streaming.mjs
            /scripts/smoke-session-mode.mjs
            /scripts/smoke-skills.mjs
            /scripts/smoke-subagent-approval.mjs
            /scripts/smoke-notification-queue.mjs
            /scripts/smoke-notification-events.mjs
            /scripts/smoke-notification-w4.mjs
            /scripts/smoke-notification-desktop.ts
            /scripts/smoke-lifetime.mjs
            /scripts/audit-usage-history.mjs
            /test/ci-workflow.test.mjs
            /test/publish-release.test.mjs
            /test/release-version.test.mjs
            /test/npm-publication.test.mjs
            /test/release-artifact.test.mjs
            /test/release-provenance.test.mjs
            /test/bundled-sounds.test.mjs
            /test/release-artifact-smoke.test.mjs
            /test/npm-cli-smoke.test.mjs
            /test/release-workflow.test.mjs
            /test/release-fixture.mjs
            /test/smoke-measurements.test.mjs
            /test/smoke-desktop-playback.test.mjs
            /test/smoke-stages.test.mjs
            /test/runtime-inventory.test.mjs
            /test/runtime-runner.test.mjs
            /test/smoke-helpers.test.mjs
            /package.json
            /package-lock.json
            /README.md
            /AGENTS.md
            /.github/workflows/ci.yml
            /.github/workflows/release.yml
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Use the verified publication npm version for CLI regressions
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Check release version and tag commit
        id: version
        env:
          TRIGGER_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$GITHUB_EVENT_NAME" = "workflow_dispatch"; then
            test "$TRIGGER_REF" = "refs/heads/$DEFAULT_BRANCH"
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          node release-policy/scripts/release-version.mjs

      - run: npm ci --ignore-scripts
      - run: mkdir -p /tmp/opencode
      - run: npm run typecheck && npm test
      - run: node release-policy/scripts/test-helpers.mjs
      - run: npm run check:package
      - run: node --test release-policy/test/release-artifact-smoke.test.mjs
      - run: node --test release-policy/test/npm-cli-smoke.test.mjs

      - name: Pack and validate release artifact
        id: artifact
        env:
          RELEASE_VERIFIED_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_VALIDATION_ATTEMPT: ${{ steps.version.outputs.validation_attempt }}
        run: node release-policy/scripts/release-artifact.mjs prepare "$RUNNER_TEMP/release-package"

      - name: Upload immutable release artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    # Allow 60 minutes for npm processing plus setup and GitHub release upload.
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERIFIED_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_VALIDATION_ATTEMPT: ${{ needs.validate.outputs.validation_attempt }}
      RELEASE_INTEGRITY: ${{ needs.validate.outputs.integrity }}
    steps:
      - name: Check out immutable publication policy only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-policy
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release-version.mjs
            /scripts/release-artifact.mjs
            /scripts/release-provenance.mjs
            /scripts/publish-release.mjs
            /scripts/npm-publication.mjs
            /scripts/github-release.mjs
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Create private job-local npm cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$(mktemp -d "$RUNNER_TEMP/npm-release-cache.XXXXXXXX")"
          chmod 700 "$cache"
          printf 'NPM_CONFIG_CACHE=%s\n' "$cache" >> "$GITHUB_ENV"
          mkdir -m 700 "$cache/xdg"
          printf 'XDG_DATA_HOME=%s\n' "$cache/xdg" >> "$GITHUB_ENV"

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Download validated archive by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-package

      - name: Verify artifact identity and actual archive contents
        run: node release-policy/scripts/release-artifact.mjs verify "$RUNNER_TEMP/release-package"

      - name: Publish package and verify npm availability
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node release-policy/scripts/publish-release.mjs "$RUNNER_TEMP/release-package"

      - name: Create GitHub release and attach the verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release-policy/scripts/github-release.mjs "$RUNNER_TEMP/release-package"
